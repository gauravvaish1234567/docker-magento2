version: '3.9'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: magento-php
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-page-cache:
        condition: service_started
    volumes:
      - ./:/var/www/html
      - magento_pub_static:/var/www/html/pub/static
      - magento_var:/var/www/html/var
    networks:
      - magento-net

  nginx:
    image: nginx:1.26-alpine
    container_name: magento-nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - magento_pub_static:/var/www/html/pub/static:ro
      - magento_var:/var/www/html/var:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - magento-net

  mysql:
    image: mysql:8.0
    container_name: magento-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - magento-net

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: magento-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Admin123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento-net

  redis-cache:
    image: redis:7-alpine
    container_name: magento-redis-cache
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - magento-net

  redis-page-cache:
    image: redis:7-alpine
    container_name: magento-redis-page-cache
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - magento-net

networks:
  magento-net:
    driver: bridge

volumes:
  mysql_data:
  opensearch_data:
  magento_pub_static:
  magento_var:
